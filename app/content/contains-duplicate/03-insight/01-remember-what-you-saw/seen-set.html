<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Growing seen set</title>
<style>
  :root {
    color-scheme: light;
    --ink: #17211b;
    --muted: #667269;
    --paper: #f5f2e9;
    --surface: #fffdf7;
    --line: #d8d4c8;
    --teal: #176b87;
    --teal-soft: #dceff3;
    --orange: #c64f13;
    --orange-soft: #fff0e6;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100%; }

  body {
    display: grid;
    place-items: center;
    padding: 8px;
    background:
      linear-gradient(rgba(23, 33, 27, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(23, 33, 27, 0.045) 1px, transparent 1px),
      var(--paper);
    background-size: 20px 20px;
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
  }

  main {
    width: min(100%, 620px);
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: 0 8px 22px rgba(23, 33, 27, 0.09);
  }

  header, .set-row, footer {
    display: flex;
    align-items: center;
  }

  header { justify-content: space-between; gap: 10px; }

  .eyebrow {
    margin: 0 0 2px;
    color: var(--teal);
    font: 700 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    text-transform: uppercase;
  }

  h1 { margin: 0; font-size: 18px; line-height: 1.1; }

  .controls { display: flex; gap: 5px; }

  button {
    width: 32px;
    height: 30px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    font: 700 18px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  button:disabled { color: #a9afa9; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid rgba(23, 107, 135, 0.28); outline-offset: 2px; }

  .array {
    display: grid;
    grid-template-columns: repeat(4, 42px);
    justify-content: center;
    gap: 8px;
    margin: 10px 0 8px;
  }

  .value {
    display: grid;
    height: 34px;
    place-items: center;
    border: 2px solid var(--line);
    border-radius: 5px;
    background: #fff;
    color: var(--muted);
    font: 700 16px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .value.past { border-color: #a8cdd6; background: var(--teal-soft); color: #0f536a; }
  .value.current { border-color: var(--orange); background: var(--orange-soft); color: #a43f0e; }

  .set-row {
    min-height: 35px;
    gap: 9px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
  }

  .set-label {
    color: var(--muted);
    font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  output {
    color: var(--teal);
    font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  footer {
    justify-content: space-between;
    gap: 12px;
    min-height: 25px;
    padding-top: 7px;
  }

  .check {
    margin: 0;
    font: 700 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .check.found { color: var(--orange); }
  .step { color: var(--muted); font-size: 11px; white-space: nowrap; }

  @media (max-width: 350px) {
    main { padding-inline: 9px; }
    h1 { font-size: 16px; }
    .array { grid-template-columns: repeat(4, 36px); gap: 5px; }
    .step { display: none; }
  }
</style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Check before adding</p>
        <h1>Has the current value been seen?</h1>
      </div>
      <div class="controls" aria-label="Scan controls">
        <button id="previous" type="button" aria-label="Previous value">&larr;</button>
        <button id="next" type="button" aria-label="Next value">&rarr;</button>
      </div>
    </header>

    <div class="array" id="array" aria-label="Array being scanned"></div>

    <div class="set-row">
      <span class="set-label">seen before check</span>
      <output id="seen" aria-live="polite"></output>
    </div>

    <footer>
      <p class="check" id="check" aria-live="polite"></p>
      <span class="step" id="step"></span>
    </footer>
  </main>

<script>
  const values = [7, 3, 9, 3];
  let currentIndex = 0;

  const array = document.querySelector('#array');
  const seenOutput = document.querySelector('#seen');
  const check = document.querySelector('#check');
  const step = document.querySelector('#step');
  const previous = document.querySelector('#previous');
  const next = document.querySelector('#next');

  function render() {
    const seen = new Set(values.slice(0, currentIndex));
    const currentValue = values[currentIndex];
    const found = seen.has(currentValue);

    array.replaceChildren();
    values.forEach((value, index) => {
      const cell = document.createElement('span');
      cell.className = index === currentIndex ? 'value current' : index < currentIndex ? 'value past' : 'value';
      cell.textContent = value;
      array.append(cell);
    });

    seenOutput.textContent = `{ ${[...seen].join(', ')} }`;
    check.textContent = found
      ? `${currentValue} is already in seen -> duplicate`
      : `${currentValue} is not in seen -> add it`;
    check.className = found ? 'check found' : 'check';
    step.textContent = `${currentIndex + 1} of ${values.length}`;
    previous.disabled = currentIndex === 0;
    next.disabled = currentIndex === values.length - 1;
  }

  previous.addEventListener('click', () => {
    currentIndex -= 1;
    render();
  });

  next.addEventListener('click', () => {
    currentIndex += 1;
    render();
  });

  render();
</script>
</body>
</html>

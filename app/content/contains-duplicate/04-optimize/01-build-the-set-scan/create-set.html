<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create the seen set</title>
<style>
  :root { color-scheme: light; --ink: #17211b; --muted: #667269; --paper: #f5f2e9; --surface: #fffdf7; --line: #d8d4c8; --teal: #176b87; --teal-soft: #dceff3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { display: grid; place-items: center; padding: 10px; background: linear-gradient(rgba(23,33,27,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(23,33,27,.045) 1px, transparent 1px), var(--paper); background-size: 20px 20px; color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
  main { width: min(100%, 620px); padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: 0 8px 22px rgba(23,33,27,.09); }
  .eyebrow { margin: 0 0 4px; color: var(--teal); font: 700 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; }
  h1 { margin: 0; font-size: 20px; line-height: 1.15; }
  .trace { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 14px 0 10px; }
  .array, .set { min-height: 58px; padding: 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .label { display: block; margin-bottom: 7px; color: var(--muted); font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .values { display: flex; gap: 5px; }
  .value { display: grid; width: 30px; height: 28px; place-items: center; border: 1px solid #a8cdd6; border-radius: 4px; background: var(--teal-soft); font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .set { min-width: 112px; border-color: #a8cdd6; }
  .empty { color: var(--teal); font: 700 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .arrow { color: var(--teal); font: 700 18px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .note { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }
  code { color: var(--ink); font: 700 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (max-width: 390px) { .trace { grid-template-columns: 1fr; } .arrow { display: none; } .set { min-width: 0; } }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Before index 0</p>
    <h1>Start with no remembered values.</h1>
    <div class="trace">
      <div class="array"><span class="label">nums</span><div class="values"><span class="value">4</span><span class="value">1</span><span class="value">7</span><span class="value">4</span></div></div>
      <span class="arrow" aria-hidden="true">&rarr;</span>
      <div class="set"><span class="label">seen</span><span class="empty">{ }</span></div>
    </div>
    <p class="note"><code>seen = new Set()</code> runs once, before the loop.</p>
  </main>
</body>
</html>

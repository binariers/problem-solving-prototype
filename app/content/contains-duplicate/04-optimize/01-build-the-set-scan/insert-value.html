<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Insert an unseen value</title>
<style>
  :root { color-scheme: light; --ink: #17211b; --muted: #667269; --paper: #f5f2e9; --surface: #fffdf7; --line: #d8d4c8; --teal: #176b87; --teal-soft: #dceff3; --orange: #c64f13; --orange-soft: #fff0e6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { display: grid; place-items: center; padding: 10px; background: linear-gradient(rgba(23,33,27,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(23,33,27,.045) 1px, transparent 1px), var(--paper); background-size: 20px 20px; color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
  main { width: min(100%, 620px); padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: 0 8px 22px rgba(23,33,27,.09); }
  .eyebrow { margin: 0 0 4px; color: var(--teal); font: 700 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; }
  h1 { margin: 0; font-size: 20px; line-height: 1.15; }
  .transition { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 9px; margin: 14px 0 10px; }
  .set { min-height: 62px; padding: 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .after { border-color: #a8cdd6; background: #f7fcfd; }
  .label { display: block; margin-bottom: 9px; color: var(--muted); font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .values { display: flex; gap: 5px; color: var(--teal); font: 700 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .added { padding: 3px 6px; margin: -4px 0; border: 2px solid var(--teal); border-radius: 4px; background: var(--teal-soft); }
  .arrow { color: var(--teal); font: 700 18px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .note { margin: 0; color: var(--muted); text-align: center; font-size: 13px; }
  code { color: var(--ink); font: 700 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (max-width: 350px) { .transition { grid-template-columns: 1fr; } .arrow { display: none; } }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">At index 2</p>
    <h1>A new value becomes remembered.</h1>
    <div class="transition">
      <div class="set"><span class="label">before checking 7</span><div class="values">{ 4, 1 }</div></div>
      <span class="arrow" aria-hidden="true">&rarr;</span>
      <div class="set after"><span class="label">after inserting 7</span><div class="values">{ 4, 1, <span class="added">7</span> }</div></div>
    </div>
    <p class="note"><code>seen.has(7)</code> was false, so the scan continues.</p>
  </main>
</body>
</html>

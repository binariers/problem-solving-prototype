<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Set state at index 3</title>
<style>
  :root { color-scheme: light; --ink: #17211b; --muted: #667269; --paper: #f5f2e9; --surface: #fffdf7; --line: #d8d4c8; --teal: #176b87; --teal-soft: #dceff3; --orange: #c64f13; --orange-soft: #fff0e6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { display: grid; place-items: center; padding: 10px; background: linear-gradient(rgba(23,33,27,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(23,33,27,.045) 1px, transparent 1px), var(--paper); background-size: 20px 20px; color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
  main { width: min(100%, 620px); padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: 0 8px 22px rgba(23,33,27,.09); }
  .eyebrow { margin: 0 0 4px; color: var(--orange); font: 700 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; }
  h1 { margin: 0; font-size: 20px; line-height: 1.15; }
  .state { display: grid; grid-template-columns: 1fr 1.4fr; gap: 9px; margin: 14px 0 10px; }
  .panel { min-height: 65px; padding: 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .label { display: block; margin-bottom: 8px; color: var(--muted); font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .current { display: grid; width: 36px; height: 32px; place-items: center; border: 2px solid var(--orange); border-radius: 5px; background: var(--orange-soft); color: #a43f0e; font: 700 16px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .set-values { display: flex; gap: 5px; }
  .value { display: grid; min-width: 30px; height: 30px; padding: 0 6px; place-items: center; border: 1px solid #a8cdd6; border-radius: 4px; background: var(--teal-soft); color: #0f536a; font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .value.match { border: 2px solid var(--orange); background: var(--orange-soft); color: #a43f0e; }
  .result { margin: 0; padding-top: 9px; border-top: 1px solid var(--line); color: var(--orange); text-align: center; font: 700 13px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (max-width: 340px) { .state { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">At index 3</p>
    <h1>Check before inserting the current 4.</h1>
    <div class="state">
      <div class="panel"><span class="label">current value</span><span class="current">4</span></div>
      <div class="panel"><span class="label">seen before check</span><div class="set-values"><span class="value match">4</span><span class="value">1</span><span class="value">7</span></div></div>
    </div>
    <p class="result">seen.has(4) &rarr; true</p>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Return when a pair matches</title>
<style>
  :root { color-scheme: light; --ink: #17211b; --muted: #667269; --paper: #f5f2e9; --surface: #fffdf7; --line: #d8d4c8; --match: #147a4b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { display: grid; place-items: center; padding: 16px; background: linear-gradient(rgba(23,33,27,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(23,33,27,.045) 1px, transparent 1px), var(--paper); background-size: 20px 20px; color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
  main { width: min(100%, 620px); padding: 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: 0 12px 30px rgba(23,33,27,.09); }
  .state { margin: 0 0 6px; color: var(--match); font: 700 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 32px); line-height: 1.1; }
  .array { display: flex; justify-content: center; gap: 8px; margin: 24px 0 16px; }
  .item { display: grid; justify-items: center; gap: 7px; }
  .value { display: grid; width: 56px; height: 56px; place-items: center; border: 2px solid var(--ink); border-radius: 6px; background: #fff; font: 700 20px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .match { border-color: var(--match); background: #e5f7ed; color: #0d6039; box-shadow: 0 0 0 3px rgba(20,122,75,.14); }
  .index { color: var(--muted); font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .match + .index { color: var(--match); }
  .trace { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0; padding-top: 15px; border-top: 1px solid var(--line); color: var(--muted); font-size: 15px; }
  code { color: var(--ink); font: 700 14px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .result { padding: 6px 9px; border-radius: 4px; background: #d6f5e3; color: #0d6039; font: 800 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (max-width: 430px) { body { padding: 9px; } main { padding: 16px; } .array { gap: 5px; } .value { width: 46px; height: 46px; font-size: 18px; } .trace { flex-wrap: wrap; } }
</style>
</head>
<body>
  <main>
    <p class="state">Match at (0, 3)</p>
    <h1>Equal values end the search.</h1>
    <div class="array" aria-label="Equal value 4 at indices 0 and 3">
      <div class="item"><span class="value match">4</span><span class="index">i = 0</span></div>
      <div class="item"><span class="value">1</span><span class="index">1</span></div>
      <div class="item"><span class="value">7</span><span class="index">2</span></div>
      <div class="item"><span class="value match">4</span><span class="index">j = 3</span></div>
    </div>
    <p class="trace"><code>nums[0] === nums[3]</code><span class="result">return true</span></p>
  </main>
</body>
</html>

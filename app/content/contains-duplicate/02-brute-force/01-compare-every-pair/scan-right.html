<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scan later indices</title>
<style>
  :root { color-scheme: light; --ink: #17211b; --muted: #667269; --paper: #f5f2e9; --surface: #fffdf7; --line: #d8d4c8; --left: #176b87; --right: #c45216; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { display: grid; place-items: center; padding: 16px; background: linear-gradient(rgba(23,33,27,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(23,33,27,.045) 1px, transparent 1px), var(--paper); background-size: 20px 20px; color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
  main { width: min(100%, 620px); padding: 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: 0 12px 30px rgba(23,33,27,.09); }
  .state { margin: 0 0 6px; color: var(--right); font: 700 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 32px); line-height: 1.1; }
  .array { display: flex; justify-content: center; gap: 8px; margin: 22px 0 13px; }
  .item { display: grid; justify-items: center; gap: 7px; }
  .value { display: grid; width: 56px; height: 56px; place-items: center; border: 2px solid var(--ink); border-radius: 6px; background: #fff; font: 700 20px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .left { border-color: var(--left); background: #e3f4f8; color: #0f536a; }
  .right { border-color: var(--right); background: #fff0e6; color: #9d3d0d; box-shadow: 0 0 0 3px rgba(196,82,22,.14); }
  .index { color: var(--muted); font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pair { display: flex; justify-content: center; gap: 7px; margin-bottom: 15px; }
  .pair span { padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pair .current { border-color: var(--right); background: #fff0e6; color: #9d3d0d; }
  .trace { margin: 0; padding-top: 15px; border-top: 1px solid var(--line); color: var(--muted); text-align: center; font-size: 15px; }
  code { color: var(--ink); font: 700 14px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (max-width: 430px) { body { padding: 9px; } main { padding: 16px; } .array { gap: 5px; } .value { width: 46px; height: 46px; font-size: 18px; } }
</style>
</head>
<body>
  <main>
    <p class="state">Inner loop</p>
    <h1>Move only the right index.</h1>
    <div class="array" aria-label="Array 4, 1, 7, 4 comparing indices 0 and 2">
      <div class="item"><span class="value left">4</span><span class="index">i = 0</span></div>
      <div class="item"><span class="value">1</span><span class="index">1</span></div>
      <div class="item"><span class="value right">7</span><span class="index">j = 2</span></div>
      <div class="item"><span class="value">4</span><span class="index">3</span></div>
    </div>
    <div class="pair" aria-label="Pair trace"><span>(0, 1)</span><span class="current">(0, 2)</span><span>(0, 3)</span></div>
    <p class="trace"><code>j = i + 1</code> avoids comparing an item with itself or repeating a pair.</p>
  </main>
</body>
</html>

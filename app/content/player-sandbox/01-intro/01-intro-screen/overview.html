<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Overview</title>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; background: #0f172a; color: #e2e8f0; }
  .box { text-align: center; padding: 16px; }
  button { font-size: 18px; padding: 10px 18px; border: 0; border-radius: 10px;
    background: #22c55e; color: #052e16; font-weight: 700; cursor: pointer; }
  .count { font-size: 40px; font-weight: 800; margin: 8px 0; }
</style>
</head>
<body>
  <div class="box">
    <div class="count" id="count">0</div>
    <button id="tap">Tap me</button>
    <p>A self-contained visual. It runs its own script and never talks to the app.</p>
  </div>
  <script>
    const el = document.getElementById('count');
    let n = 0;
    document.getElementById('tap').addEventListener('click', () => { el.textContent = ++n; });
  </script>
</body>
</html>

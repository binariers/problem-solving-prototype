<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hash map</title>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  body { display: grid; place-items: center; background: #052e16; color: #bbf7d0; }
  button { font-size: 16px; padding: 8px 14px; border: 0; border-radius: 8px;
    background: #22c55e; color: #052e16; font-weight: 700; cursor: pointer; }
  .out { font-size: 22px; font-weight: 800; margin-top: 10px; min-height: 28px; }
</style>
</head>
<body>
  <div style="text-align:center">
    <button id="go">Look up 9</button>
    <div class="out" id="out"></div>
    <p>O(1) average</p>
  </div>
  <script>
    const map = { 3: 0, 7: 1, 1: 2, 9: 3, 4: 4 };
    document.getElementById('go').addEventListener('click', () => {
      document.getElementById('out').textContent = 'index ' + map[9];
    });
  </script>
</body>
</html>
